# 백엔드 service account와 권한 (ADR 013 "백엔드 권한")
# RBAC는 namespace 이름으로 범위를 좁힐 수 없어서 ClusterRole로 준다.
# lab- namespace 밖을 다루지 못하게 하는 제한은 hackforge-backend-policy.yaml(ValidatingAdmissionPolicy)에 있다.
apiVersion: v1
kind: Namespace
metadata:
  name: hackforge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hackforge-backend
  namespace: hackforge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hackforge-backend
rules:
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
  # 세션 namespace마다 RoleBinding을 만든다. 담을 수 있는 역할은 Pod 로그 읽기(ADR 021)와 공격 대상·터미널 연결(ADR 022) 두 개
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [hackforge-lab-log-reader, hackforge-lab-connect]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hackforge-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hackforge-backend
subjects:
  - kind: ServiceAccount
    name: hackforge-backend
    namespace: hackforge
---
# 실습 Pod 로그 읽기(ADR 021). 클러스터 전체에 묶지 않고, 백엔드가 lab- namespace마다 RoleBinding lab-log-reader로 묶는다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hackforge-lab-log-reader
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
# 공격 대상 port-forward와 웹 터미널 exec(ADR 022). 백엔드가 lab- namespace마다 RoleBinding lab-connect로 묶는다.
# WebSocket으로 연결하면 get, SPDY로 연결하면 create로 권한을 확인해서 둘 다 준다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hackforge-lab-connect
rules:
  - apiGroups: [""]
    resources: [pods/portforward, pods/exec]
    verbs: [get, create]
